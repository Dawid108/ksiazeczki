<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korona Gór Bystrzyckich</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <script src="script.js"></script>
    <style>
        :root {
            --primary-color: #2d5a27;
            --secondary-color: #4a7c44;
            --accent-color: #f4f1de;
            --text-dark: #333;
            --bg-light: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .stats {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--secondary-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-image {
            width: 100%;
            object-fit: cover;
            background-color: #ddd;
        }

        .card-content {
            padding: 15px;
        }

        .card-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--primary-color);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 10;
        }

        .peak-name {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            color: var(--primary-color);
        }

        .peak-info {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .peak-info span {
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Korona Gór Bystrzyckich</h1>
    <div class="stats">Postęp: 15 / 15 (100%) ✅</div>
</header>

<div class="grid-container" id="gallery">
    <!-- Karty zostaną wygenerowane przez JS -->
</div>

<script>
    const szczyty = [
{lp: 1, nazwa: "Barczowa", wys: 811, data: "06.06.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641509/barczowa_mpqfvd.png"},
{lp: 2, nazwa: "Biesiec", wys: 833, data: "11.08.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641317/biesiec_qp0qr5.png"},
{lp: 3, nazwa: "Bochniak", wys: 712, data: "11.04.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641834/bochniak_htmjoh.png"},
{lp: 4, nazwa: "Czerniec", wys: 891, data: "01.11.2022", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1777985003/czerniec_uz89it.png"},
{lp: 5, nazwa: "Dębowiec", wys: 665, data: "11.04.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641833/debowiec_xqm7t3.png"},
{lp: 6, nazwa: "Góra Błażkowa", wys: 805, data: "11.08.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641317/blazkowa-gora_q38hlx.png"},
{lp: 7, nazwa: "Jagodna", wys: 997, data: "09.08.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641833/jagodna-rekord_ax1tum.png"},
{lp: 8, nazwa: "Jagodna Północna", wys: 985, data: "27.10.2023", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641833/jagodna-polnocna_cgaefj.png"},
{lp: 9, nazwa: "Jedlnik", wys: 746, data: "11.04.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641833/jedlnik_oz4dx5.png"},
{lp: 10, nazwa: "Kamienna Góra", wys: 704, data: "06.06.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641509/kamienna-gora_pe91oz.png"},
{lp: 11, nazwa: "Kłobuk", wys: 815, data: "11.08.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641317/klobuk_zigthe.png"},
{lp: 12, nazwa: "Łomnicka Równia", wys: 897, data: "06.06.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641509/lomnicka-rownia_xqswty.png"},
{lp: 13, nazwa: "Ptasia Góra", wys: 745, data: "11.08.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641317/ptasia-gora_fkq5s2.png"},
{lp: 14, nazwa: "Wolarz", wys: 852, data: "11.08.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641317/wolarz_c15uqu.png"},
{lp: 15, nazwa: "Zamkowa Kopa", wys: 784, data: "04.06.2026", img: "https://res.cloudinary.com/diljpkw9f/image/upload/v1786641508/zamkowa-kopa_wxzeci.png"}
    ];

    const gallery = document.getElementById('gallery');

    szczyty.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-number">${s.lp}</div>
            <img src="${s.img}" alt="${s.nazwa}" class="card-image" onerror="this.src='https://via.placeholder.com/400x250?text=Brak+zdjęcia'">
            <div class="card-content">
                <h2 class="peak-name">${s.nazwa}</h2>
                <div class="peak-info">
                    <div><span>Wysokość:</span> ${s.wys} m n.p.m.</div>
                    <div class="badge">📅 Zdobyto: ${s.data}</div>
                </div>
            </div>
        `;
        gallery.appendChild(card);
    });
</script>

</body>
</html>
